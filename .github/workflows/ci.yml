name: CI Pipeline

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install scikit-learn joblib

      - name: Train the model
        run: python train.py

      - name: Build Docker image
        run: docker build -t mlops3-image .

      - name: Run container
        run: docker run --rm mlops3-image
